<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Ben Smith</title>
  <meta name="description" content="Ben Smith's resume — view online or download as a PDF." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .resume-page {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 140px 40px 80px;
    }
    .resume-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .resume-header h1 {
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .resume-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .resume-viewer {
      margin-top: 40px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }
    .resume-viewer embed {
      display: block;
      width: 100%;
      height: 90vh;
      border: none;
      border-radius: 0;
    }
    .resume-fallback {
      display: none;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- ── NAV ── -->
  <nav id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Benjamin Smith</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
    </div>
  </nav>

  <main class="resume-page">
    <div class="resume-header">
      <h1>Resume</h1>
      <div class="resume-actions">
        <a href="BenSmithResume.pdf" download class="btn btn-primary btn-lg">Download Resume (PDF)</a>
        <a href="index.html" class="btn btn-outline btn-lg">Back to Site</a>
      </div>
    </div>

    <div class="resume-viewer">
      <embed src="BenSmithResume.pdf" type="application/pdf" />
      <p class="resume-fallback">Your browser can't display the PDF inline. Use the download button above to view it.</p>
    </div>
  </main>

  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('nav--scrolled', window.scrollY > 60);
    });
  </script>

</body>
</html>
